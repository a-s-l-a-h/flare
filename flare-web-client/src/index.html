<!DOCTYPE html>
<html lang="en" style="height:100%;overflow:hidden;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flare Demo</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <style>
  /* Exclude inputs from user-select: none so typing works */
  *:not(input):not(textarea) {
    touch-action: manipulation !important;
    user-select: none !important;
    -webkit-user-select: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }
  
  #flare-overlay, #flare-overlay > div,
  #flare-drawer, #flare-drawer > div,
  #flare-end_drawer, #flare-end_drawer > div {
    pointer-events: none;
  }

  /* 3. Catch clicks ONLY on the actual DivKit contents when they are visible */
  #flare-overlay > div > div,
  #flare-drawer > div > div,
  #flare-end_drawer > div > div {
    pointer-events: auto;
  }
</style>
</head>
<body style="margin:0;padding:0;background:#0f0f1a;font-family:sans-serif;height:100%;overflow:hidden;">

  <div id="flare-login" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;"></div>

  <div id="flare-app" style="width:100%;height:100vh;overflow:hidden;position:fixed;top:0;left:0;display:none;flex-direction:column;">
    <div id="flare-top_bar" style="flex-shrink:0;"></div>
    <div id="flare-root" style="flex:1;min-height:0;overflow:hidden;position:relative;"></div>
    <div id="flare-bottom_bar" style="flex-shrink:0;"></div>
  </div>

  <!-- Transition overlay — Lottie animation shown during content navigation.
       Old screen stays visible underneath (mirrors Android TransitionOverlayView). -->
  <div id="flare-transition-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:800;align-items:center;justify-content:center;">
    <div id="flare-transition-lottie" style="width:72px;height:72px;"></div>
    <div id="flare-transition-error" style="display:none;background:#fff;border-radius:16px;padding:24px;max-width:320px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.15);">
      <div id="flare-transition-error-msg" style="font-size:14px;color:#333;margin-bottom:16px;"></div>
      <button id="flare-transition-retry" style="padding:10px 20px;border:none;border-radius:10px;background:#8e44ad;color:#fff;font-weight:bold;cursor:pointer;">Retry</button>
      <div>
        <button id="flare-transition-reset" style="margin-top:12px;padding:6px 10px;border:none;background:transparent;color:#999;font-size:12px;text-decoration:underline;cursor:pointer;">Sign out &amp; reset</button>
      </div>
    </div>
  </div>

  <!-- Off-canvas overlays. Same pointer-events pattern as #flare-overlay: the
       wrapper is click-through, only the actual rendered DivKit content
       (once visible) catches taps. Each region's own layout JSON controls
       its own internal visibility/animation (e.g. "@{flare_drawer_open ? ...}"). -->
  <div id="flare-drawer" style="pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:900;overflow:hidden;"></div>
  <div id="flare-end_drawer" style="pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:900;overflow:hidden;"></div>

  <div id="flare-overlay" style="pointer-events:none; position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;overflow:hidden;"></div>

  <!-- Note: added pointer-events:none here inline just to be safe -->
  <!-- <div id="flare-overlay" style="pointer-events:none; position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;overflow:hidden;"></div> -->
<!-- all 6 scaffold  -->

    window.__flare__ = {
      wsUrl: "/socket",
      token: null,
      entryScreen: "home",
      persistentScreens: [
        { screen: "bottom_bar", region: "bottom_bar" },
        { screen: "overlay",     region: "overlay" },
        { screen: "top_bar",    region: "top_bar" },
        { screen: "drawer",     region: "drawer" },
        { screen: "end_drawer", region: "end_drawer" }
      ],
      scaffoldRegions: ["bottom_bar", "top_bar", "drawer", "end_drawer"]
    };
  </script> -->

  <!-- this only 2 region   -->
   <script>
  window.__flare__ = {
    wsUrl: "/socket",
    token: null,
    entryScreen: "home",
    persistentScreens: [
      { screen: "bottom_bar", region: "bottom_bar" }
    ],
    scaffoldRegions: ["bottom_bar"]
  };
</script>

  
</body>
</html>
